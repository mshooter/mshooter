<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d">
  <title id="t">Moira Shooter</title>
  <desc id="d">R&amp;D Engineer. Computer graphics, computer vision and machine learning.</desc>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans  { font-family: Helvetica, Arial, sans-serif; }
    .bob    { animation: bob 0.8s ease-in-out infinite; }
    .head   { transform-origin: 756px 124px; animation: nod 1.6s ease-in-out infinite; }
    .tail   { transform-origin: 878px 124px; animation: wag 0.45s ease-in-out infinite alternate; }
    .legA   { animation: trot 0.8s ease-in-out infinite alternate; }
    .legB   { animation: trot 0.8s ease-in-out infinite alternate-reverse; }
    .fl { transform-origin: 780px 140px; } .hl { transform-origin: 866px 138px; }
    .ground { stroke-dasharray: 10 14; animation: ground 0.8s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: .4s } .p3 { animation-delay: .8s } .p4 { animation-delay: 1.2s }
    .float { animation: float 7s ease-in-out infinite; }
    .f2 { animation-delay: -2s; animation-duration: 9s } .f3 { animation-delay: -4s; animation-duration: 8s }
    .w { opacity: 0; animation: cycle 9s infinite; }
    .w2 { animation-delay: 3s } .w3 { animation-delay: 6s }
    .bar { transform-origin: 62px 0; animation: bar 9s ease-in-out infinite; }
    @keyframes bob    { 50% { transform: translateY(-3px) } }
    @keyframes nod    { 50% { transform: rotate(-5deg) } }
    @keyframes wag    { from { transform: rotate(-16deg) } to { transform: rotate(18deg) } }
    @keyframes trot   { from { transform: rotate(-17deg) } to { transform: rotate(17deg) } }
    @keyframes ground { to { stroke-dashoffset: -24 } }
    @keyframes pulse  { 50% { transform: scale(1.7); opacity: .6 } }
    @keyframes float  { 0%,100% { transform: translateY(0); opacity: .25 } 50% { transform: translateY(-14px); opacity: .6 } }
    @keyframes cycle  { 0% { opacity: 0; transform: translateY(6px) } 6%,28% { opacity: 1; transform: none } 34%,100% { opacity: 0; transform: translateY(-6px) } }
    @keyframes bar    { 0%,100% { transform: scaleX(1) } 33% { transform: scaleX(1.9) } 66% { transform: scaleX(2.6) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } .w1 { opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2130"/><stop offset="1" stop-color="#18241f"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#a6c7b3" opacity=".14"/>
    </pattern>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#dots)"/>

  <!-- drifting particles -->
  <g fill="#e0a58c">
    <circle class="float" cx="590" cy="230" r="3"/><circle class="float f2" cx="640" cy="90" r="2.5"/>
    <circle class="float f3" cx="560" cy="60" r="2"/><circle class="float f2" cx="980" cy="250" r="2.5"/>
  </g>

  <!-- dog drawn as a pose-estimation skeleton -->
  <g transform="translate(0,26)">
  <line class="ground" x1="640" y1="211" x2="970" y2="211" stroke="#a6c7b3" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <g class="bob">
    <g stroke="#e0a58c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- spine -->
      <path d="M756 124 L790 118 L830 122 L868 127 L878 124"/>
      <path d="M780 140 L790 118"/><path d="M866 138 L868 127"/>
      <path d="M780 140 L824 150 L866 138" opacity=".55"/>
      <!-- tail -->
      <g class="tail"><path d="M878 124 L904 104 L920 80"/>
        <circle cx="904" cy="104" r="4.5" fill="#e0a58c" stroke="none"/><circle cx="920" cy="80" r="4.5" fill="#e0a58c" stroke="none"/></g>
      <!-- head -->
      <g class="head"><path d="M756 124 L734 104 L702 120"/><path d="M734 104 L744 82"/>
        <circle cx="734" cy="104" r="5" fill="#e0a58c" stroke="none"/><circle cx="702" cy="120" r="5.5" fill="#e0a58c" stroke="none"/>
        <circle cx="744" cy="82" r="4.5" fill="#e0a58c" stroke="none"/><circle cx="719" cy="105" r="3" fill="#f0ebe3" stroke="none"/></g>
      <!-- legs: diagonal pairs move together -->
      <g class="fl legA"><path d="M780 140 L776 172 L772 205"/><circle cx="776" cy="172" r="4.5" fill="#e0a58c" stroke="none"/><circle cx="772" cy="205" r="4.5" fill="#e0a58c" stroke="none"/></g>
      <g class="fl legB"><path d="M780 140 L784 172 L790 205"/><circle cx="784" cy="172" r="4.5" fill="#e0a58c" stroke="none"/><circle cx="790" cy="205" r="4.5" fill="#e0a58c" stroke="none"/></g>
      <g class="hl legB"><path d="M866 138 L884 166 L876 205"/><circle cx="884" cy="166" r="4.5" fill="#e0a58c" stroke="none"/><circle cx="876" cy="205" r="4.5" fill="#e0a58c" stroke="none"/></g>
      <g class="hl legA"><path d="M866 138 L852 166 L858 205"/><circle cx="852" cy="166" r="4.5" fill="#e0a58c" stroke="none"/><circle cx="858" cy="205" r="4.5" fill="#e0a58c" stroke="none"/></g>
    </g>
    <g fill="#a6c7b3">
      <circle class="pulse" cx="756" cy="124" r="5"/><circle class="pulse p2" cx="790" cy="118" r="5"/><circle class="pulse p3" cx="830" cy="122" r="5"/>
      <circle class="pulse p4" cx="868" cy="127" r="5"/><circle class="pulse p2" cx="780" cy="140" r="5"/><circle class="pulse p3" cx="866" cy="138" r="5"/>
    </g>
  </g>
  </g>

  <text class="serif" x="60" y="118" font-size="58" font-weight="600" fill="#f0ebe3">Moira Shooter</text>
  <text class="sans" x="62" y="160" font-size="22" font-weight="600" fill="#a6c7b3">R&amp;D Engineer</text>
  <g class="sans" font-size="18" fill="#b5ada0">
    <text class="w w1" x="62" y="200" style="animation-delay:0s">Computer graphics</text>
    <text class="w w2" x="62" y="200">Computer vision</text>
    <text class="w w3" x="62" y="200">Machine learning</text>
  </g>
  <g transform="translate(0,225)"><rect class="bar" x="62" y="0" width="64" height="4" rx="2" fill="#e0a58c"/></g>
</svg>
