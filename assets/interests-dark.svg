<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Interests: graphics and real-time technology, computer vision and 3D reconstruction, machine learning that ships, developer tooling, DIY robotics">
<style>
.sage{--c:#a6c7b3}.terra{--c:#e0a58c}
text{font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#f0ebe3}
.ln{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.nd{fill:var(--c)}
.i{animation:bob 4s ease-in-out infinite}
.i:nth-child(2){animation-delay:-.8s}.i:nth-child(3){animation-delay:-1.6s}.i:nth-child(4){animation-delay:-2.4s}.i:nth-child(5){animation-delay:-3.2s}
.pl{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d2{animation-delay:.8s}.d3{animation-delay:1.6s}
.look{animation:look 3.5s ease-in-out infinite}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.slash{animation:slash 3s ease-in-out infinite;transform-origin:28px 28px}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pl{50%{transform:scale(1.6);opacity:.55}}
@keyframes look{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes slash{50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="i sage"><g transform="translate(72,12)"><g class="ln"><path d="M28 3 L53 21 L45 51 L11 51 L3 21 Z"/><path d="M28 3 L28 30 M3 21 L28 30 L53 21 M11 51 L28 30 L45 51"/></g>
<g class="nd"><circle cx="28" cy="3" r="3"/><circle cx="53" cy="21" r="3"/><circle cx="45" cy="51" r="3"/><circle cx="11" cy="51" r="3"/><circle cx="3" cy="21" r="3"/><circle class="pl" cx="28" cy="30" r="3.5"/></g></g><text x="100" y="112" text-anchor="middle">Graphics &amp; real-time</text></g>
<g class="i terra"><g transform="translate(272,12)"><g class="ln"><path d="M2 28 Q28 3 54 28 Q28 53 2 28 Z"/><circle cx="28" cy="28" r="11"/></g>
<g class="nd"><circle class="look" cx="28" cy="28" r="5"/></g></g><text x="300" y="112" text-anchor="middle">Vision &amp; 3D</text></g>
<g class="i sage"><g transform="translate(472,12)"><g class="ln"><path d="M6 14 L28 6 M6 14 L28 28 M6 14 L28 50 M6 42 L28 6 M6 42 L28 28 M6 42 L28 50 M28 6 L50 28 M28 28 L50 28 M28 50 L50 28" opacity=".7"/></g>
<g class="nd"><circle cx="6" cy="14" r="4"/><circle cx="6" cy="42" r="4"/><circle class="pl" cx="28" cy="6" r="4"/><circle class="pl d2" cx="28" cy="28" r="4"/><circle class="pl d3" cx="28" cy="50" r="4"/><circle cx="50" cy="28" r="4.5"/></g></g><text x="500" y="112" text-anchor="middle">ML that ships</text></g>
<g class="i terra"><g transform="translate(672,12)"><g class="ln"><path d="M19 14 L4 28 L19 42"/><path d="M37 14 L52 28 L37 42"/><path class="slash" d="M33 6 L23 50"/></g></g><text x="700" y="112" text-anchor="middle">Developer tooling</text></g>
<g class="i sage"><g transform="translate(872,12)"><g class="ln"><rect x="8" y="16" width="40" height="32" rx="9"/><path d="M28 16 L28 6"/><path d="M19 40 L37 40"/><path d="M2 30 L8 30 M48 30 L54 30"/></g>
<g class="nd"><circle cx="28" cy="5" r="3.5" class="pl"/><circle class="blink" cx="20" cy="29" r="4"/><circle class="blink" cx="36" cy="29" r="4"/></g></g><text x="900" y="112" text-anchor="middle">DIY robotics</text></g>
</svg>